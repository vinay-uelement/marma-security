AWSTemplateFormatVersion: '2010-09-09'
Description: ACM certificate for thedigitaldrift.in (DNS validation)

Parameters:
  DomainName:
    Type: String
    Default: thedigitaldrift.in
  Route53HostedZoneId:
    Type: String
    Default: ""
    Description: >
      Route 53 Hosted Zone ID for fully-automated DNS validation.
      Leave empty if your DNS is managed outside AWS (Cloudflare, GoDaddy, etc.)
      — CloudFormation will pause until you add the CNAME records manually.

Conditions:
  UseRoute53: !Not [!Equals [!Ref Route53HostedZoneId, ""]]

Resources:
  Certificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref DomainName
      SubjectAlternativeNames:
        - !Sub "www.${DomainName}"
      ValidationMethod: DNS
      DomainValidationOptions: !If
        - UseRoute53
        - - DomainName: !Ref DomainName
            HostedZoneId: !Ref Route53HostedZoneId
          - DomainName: !Sub "www.${DomainName}"
            HostedZoneId: !Ref Route53HostedZoneId
        - !Ref AWS::NoValue

Outputs:
  CertificateArn:
    Value: !Ref Certificate
    Export:
      Name: !Sub "${AWS::StackName}-CertificateArn"
  DomainName:
    Value: !Ref DomainName
    Export:
      Name: !Sub "${AWS::StackName}-DomainName"
