AWSTemplateFormatVersion: '2010-09-09'
Description: ECR repository for marma-security

Parameters:
  RepositoryName:
    Type: String
    Default: marma-security

Resources:
  ECRRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Ref RepositoryName
      ImageScanningConfiguration:
        ScanOnPush: true
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Expire untagged images beyond 10",
                "selection": {
                  "tagStatus": "untagged",
                  "countType": "imageCountMoreThan",
                  "countNumber": 10
                },
                "action": { "type": "expire" }
              }
            ]
          }

Outputs:
  RepositoryUri:
    Value: !Sub "${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${RepositoryName}"
    Export:
      Name: !Sub "${AWS::StackName}-RepositoryUri"
  RepositoryName:
    Value: !Ref RepositoryName
    Export:
      Name: !Sub "${AWS::StackName}-RepositoryName"
