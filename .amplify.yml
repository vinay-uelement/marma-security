version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        - env | grep -e NEXT_PUBLIC_ >> .env.production   # all NEXT_PUBLIC_ vars
        - env | grep -e API_BASE_URL -e DATABASE_URL >> .env.production  # server-only vars
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - "**/*"
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*   # ← also cache Next.js build cache!
  env:
    variables:
      NODE_VERSION: "20"